name: Android CI & Release APK

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Unit Tests & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore (optional)
        env:
          ORBIT_KEYSTORE_BASE64: ${{ secrets.ORBIT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ORBIT_KEYSTORE_BASE64" ]; then
            printf '%s' "$ORBIT_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "${{ runner.temp }}/orbit-release.jks"
            echo "ORBIT_KEYSTORE_PATH=${{ runner.temp }}/orbit-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests and assemble release APK
        env:
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          ORBIT_KEYSTORE_ALIAS: ${{ secrets.ORBIT_KEYSTORE_ALIAS }}
          ORBIT_KEYSTORE_KEY_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-eq-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload unit test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
